name: Build Bridge Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bridge-desktop/**'
      - 'mt5-bridge/wine-mt5-connector.py'
      - 'mt5-bridge/mt5_paths.py'
      - 'mt5-bridge/MT5FileBridgeEA.mq5'
      - 'mt5-bridge/CLIENT_PLATFORMS.md'
      - '.github/workflows/bridge-desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bridge-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install bridge-desktop dependencies
        working-directory: bridge-desktop
        run: npm ci

      - name: Build bundled desktop installer
        working-directory: bridge-desktop
        run: |
          npm run icons
          npm run prepare:resources:release
          npm run tauri build

      - name: Collect installers
        run: |
          mkdir -p private/downloads/bridge-desktop
          shopt -s nullglob
          for f in bridge-desktop/src-tauri/target/release/bundle/**/*.{msi,exe,dmg,deb,AppImage}; do
            cp "$f" private/downloads/bridge-desktop/
          done
          ls -la private/downloads/bridge-desktop/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-desktop-${{ matrix.platform }}
          path: private/downloads/bridge-desktop/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: bridge-desktop-*
          merge-multiple: true
          path: private/downloads/bridge-desktop

      - name: List installers
        run: |
          ls -lah private/downloads/bridge-desktop/ || true
          if [ -z "$(ls -A private/downloads/bridge-desktop/ 2>/dev/null)" ]; then
            echo "No installers built — skipping release"
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=bridge-desktop-v1.0.2
          gh release delete "$TAG" -y 2>/dev/null || true
          gh release create "$TAG" private/downloads/bridge-desktop/* \
            --title "TradeIntel Bridge Desktop v1.0.2" \
            --notes "Browse for MT5 folder (accepts Experts/MQL5/Files), HFM Program Files scan, Experts→Files path normalization, clickable candidate list, HFM MetaEditor discovery. Self-contained installers. Download from your TradeIntel dashboard." \
            --latest

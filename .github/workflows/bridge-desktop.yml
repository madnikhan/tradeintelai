name: Build Bridge Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bridge-desktop/**'
      - 'mt5-bridge/wine-mt5-connector.py'
      - 'mt5-bridge/MT5FileBridgeEA.mq5'
      - 'mt5-bridge/CLIENT_PLATFORMS.md'
      - '.github/workflows/bridge-desktop.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bridge-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install bridge-desktop dependencies
        working-directory: bridge-desktop
        run: npm ci

      - name: Build bundled desktop installer
        working-directory: bridge-desktop
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run icons
            npm run prepare:resources:release
            codesign --force --sign - src-tauri/resources/cloudflared/cloudflared || true
            PY=$(find src-tauri/resources/python -name python3 -type f | head -1)
            if [ -n "$PY" ]; then codesign --force --sign - "$PY" || true; fi
            npm run tauri build
          else
            npm run build:desktop
          fi

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p private/downloads/bridge-desktop
          shopt -s nullglob
          for f in bridge-desktop/src-tauri/target/release/bundle/**/*.{msi,exe,dmg,deb,AppImage}; do
            cp "$f" private/downloads/bridge-desktop/
          done
          ls -la private/downloads/bridge-desktop/ || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-desktop-${{ matrix.platform }}
          path: private/downloads/bridge-desktop/
          if-no-files-found: warn

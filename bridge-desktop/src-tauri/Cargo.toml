[package]
name = "tradeintel-bridge-desktop"
version = "1.0.0"
description = "TradeIntel AI MT5 Bridge Desktop"
authors = ["TradeIntel AI"]
edition = "2021"

[lib]
name = "tradeintel_bridge_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
parking_lot = "0.12"
regex = "1"
urlencoding = "2"
arboard = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
